services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: siteapi
      POSTGRES_USER: siteapi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siteapi}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteapi -d siteapi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/siteapi
      DB_USERNAME: siteapi
      DB_PASSWORD: ${DB_PASSWORD:-siteapi}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5500}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  db-data:
